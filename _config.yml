# Site settings
title: Kyle Parrella # site title
description: >- # site description
  He's a dubious character, that's for sure 
lang: en-US # default lang
direction: ltr # text direction "ltr" | "rtl", can be overridden per page
timezone: NorthAmerica/Chicago # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/kylep1014/kylep1014.github.io # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Kyle Parrella # author name
  bio: >- # tell to the world
    He's a dubious character, that's for sure
  username: kylep1014 # general username
  github: kylep1014 # github username
  twitter: DNE # twitter username
  facebook: DNE # facebook username
  email: parrellakyle@gmail.com # email adress
  avatar: /assets/img/Headshot.jpg # change with your own avatar

# URL settings
url: "https://kylep1014.github.io" #
baseurl:
permalink: /:title/
google_analytics: # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec
  - package.json
  - vercel.json

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
